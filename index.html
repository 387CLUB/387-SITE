<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>387CLUB</title>
<meta name="description" content="387CLUB — Sello discográfico independiente de Salta Capital.">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #8a8a8a;
    --line: #262626;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

  /* ---------- pestañas ---------- */
  nav.tabs {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  nav.tabs .wrap { display: flex; gap: 28px; align-items: center; height: 44px; }
  nav.tabs a {
    text-decoration: none; font-size: 13px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); padding: 4px 0;
    border-bottom: 1px solid transparent;
  }
  nav.tabs a:hover { color: var(--fg); }
  nav.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg); }

  /* ---------- sprites caminando ---------- */
  .walkway { position: relative; height: 72px; overflow: hidden; border-bottom: 1px solid var(--line); }
  .sprite { position: absolute; bottom: 0; left: 0; width: 40px; height: 64px; will-change: transform; }
  .sprite canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .sprite.gif { width: auto; }
  .sprite img { height: 100%; width: auto; image-rendering: pixelated; display: block; }

  /* ---------- título ---------- */
  header.brand { padding: 56px 0 8px; }
  header.brand h1 {
    font-family: var(--font); font-weight: 700;
    font-size: clamp(56px, 15vw, 168px);
    letter-spacing: -.05em; line-height: .9;
  }
  h2.section {
    font-weight: 400; font-size: 13px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--dim); margin: 36px 0 16px;
  }

  /* ---------- slider de videos ---------- */
  .slider { position: relative; }
  .track {
    display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; padding-bottom: 4px;
  }
  .track::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 min(640px, 86%); scroll-snap-align: start; }
  .video { position: relative; aspect-ratio: 16 / 9; background: #0b0b0b; border: 1px solid var(--line); }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video.empty { display: grid; place-items: center; text-align: center; color: var(--dim); font-size: 13px; padding: 20px; }
  .video button.thumb { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: #000 center / cover no-repeat; cursor: pointer; }
  .video button.thumb::after { content: "▶"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; line-height: 62px; text-align: center; font-size: 22px; color: #fff; background: rgba(0,0,0,.6); border: 1px solid #fff; }
  .video button.thumb:hover::after, .video button.thumb:focus-visible::after { background: #fff; color: #000; }
  .slide p { font-size: 13px; color: var(--dim); margin-top: 8px; }
  .slide p b { color: var(--fg); font-weight: 400; }
  .arrows { display: flex; gap: 8px; margin-top: 12px; }
  .arrows button {
    background: none; color: var(--fg); border: 1px solid var(--line);
    width: 40px; height: 40px; font: 16px var(--font); cursor: pointer;
  }
  .arrows button:hover { border-color: var(--fg); }

  /* ---------- artistas + banner ---------- */
  .cols { display: grid; grid-template-columns: 1fr 300px; gap: 40px; align-items: start; }
  .artist { padding: 22px 0; border-top: 1px solid var(--line); }
  .artist h3 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .releases { list-style: none; margin-top: 10px; }
  .releases li {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 6px 0; font-size: 15px; border-bottom: 1px dotted var(--line);
  }
  .releases li span { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .releases a { text-decoration: none; }
  .releases a:hover { text-decoration: underline; }

  aside.ad { position: sticky; top: 64px; }
  .ad-label { font-size: 10px; letter-spacing: .15em; color: var(--dim); text-transform: uppercase; margin-bottom: 6px; }

  /* Banner de mentira (hecho con CSS). Para usar un gif propio:
     reemplazá el contenido de <div id="fakeAd"> por <a href="#"><img src="tu-banner.gif" alt="" width="300"></a> */
  #fakeAd {
    position: relative; overflow: hidden; min-height: 250px; padding: 18px 14px;
    background: #ffeb00; color: #d00000; text-align: center;
    font-family: "Comic Sans MS", "Comic Neue", Impact, sans-serif;
    border: 4px solid; border-image: linear-gradient(90deg, #f0f, #0ff, #ff0, #f0f) 1;
    animation: borde 1.2s linear infinite;
  }
  @keyframes borde { 50% { filter: hue-rotate(120deg); } }
  #fakeAd .big { font-size: 24px; font-weight: 900; line-height: 1.05; text-transform: uppercase; animation: parpadeo .9s steps(2) infinite; }
  @keyframes parpadeo { 50% { opacity: .25; } }
  #fakeAd .small { font-size: 14px; margin: 10px 0 14px; color: #111; }
  #fakeAd .cta {
    display: inline-block; background: #00c000; color: #fff; border: 3px outset #7f7;
    padding: 8px 16px; font: 900 15px "Comic Sans MS", Impact, sans-serif; cursor: pointer;
    animation: salto .6s ease-in-out infinite alternate;
  }
  @keyframes salto { to { transform: translateY(-4px) scale(1.05); } }
  #fakeAd .marquee { position: absolute; left: 0; right: 0; bottom: 0; background: #000; color: #0f0; font: 12px monospace; white-space: nowrap; padding: 3px 0; overflow: hidden; }
  #fakeAd .marquee span { display: inline-block; padding-left: 100%; animation: marq 9s linear infinite; }
  @keyframes marq { to { transform: translateX(-100%); } }
  #fakeAd .x { position: absolute; top: 2px; right: 6px; font: 12px Arial, sans-serif; color: #555; cursor: pointer; }

  /* ---------- páginas ---------- */
  .page { display: none; }
  .page.active { display: block; }
  .prose { max-width: 640px; font-size: 18px; }
  .prose p { margin-bottom: 1em; }
  .big-artist { display: grid; grid-template-columns: 90px 1fr; gap: 20px; padding: 26px 0; border-top: 1px solid var(--line); }
  .big-artist .sprite-static { width: 80px; height: 128px; }
  .big-artist canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .big-artist img { width: 100%; height: 100%; object-fit: contain; object-position: left bottom; image-rendering: pixelated; display: block; }
  .big-artist h3 { font-size: 30px; letter-spacing: -.02em; }
  .big-artist p { color: var(--dim); margin: 6px 0 10px; max-width: 560px; }
  .links { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
  .links a { text-decoration: none; color: var(--dim); border-bottom: 1px solid var(--line); }
  .links a:hover { color: var(--fg); border-bottom-color: var(--fg); }
  .artist .links { margin-top: 12px; }

  footer { margin: 80px 0 40px; font-size: 12px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 16px; }

  @media (max-width: 800px) {
    .cols { grid-template-columns: 1fr; }
    aside.ad { position: static; max-width: 300px; }
    nav.tabs .wrap { gap: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #fakeAd, #fakeAd .big, #fakeAd .cta, #fakeAd .marquee span { animation: none; }
    #fakeAd .marquee span { padding-left: 0; }
  }
</style>
</head>
<body>

<nav class="tabs" aria-label="Principal">
  <div class="wrap">
    <a href="#inicio" data-tab="inicio">Inicio</a>
    <a href="#nosotros" data-tab="nosotros">Quiénes somos</a>
    <a href="#artistas" data-tab="artistas">Artistas</a>
  </div>
</nav>

<div class="walkway" id="walkway" aria-hidden="true"></div>

<main class="wrap">
  <header class="brand"><h1>387CLUB</h1></header>

  <!-- ================= INICIO ================= -->
  <section class="page" id="page-inicio">
    <h2 class="section">Últimos lanzamientos</h2>
    <div class="slider">
      <div class="track" id="track"></div>
      <div class="arrows">

      </div>

    <h2 class="section">Artistas</h2>
    <div class="cols">
      <div id="artistList"></div>
      <aside class="ad">
        <div class="ad-label">Publicidad</div>
        <div id="fakeAd"></div>
      </aside>
    </div>
  </section>

  <!-- ================= QUIÉNES SOMOS ================= -->
  <section class="page" id="page-nosotros">
    <h2 class="section">Quiénes somos</h2>
    <div class="prose">
      <p>Sello discográfico independiente fundado por Lucas Torres &amp; Santiago González en Salta Capital, 2022</p>
    </div>
  </section>

  <!-- ================= ARTISTAS ================= -->
  <section class="page" id="page-artistas">
    <h2 class="section">Artistas del sello</h2>
    <div id="artistPage"></div>
  </section>

  <footer>© 387CLUB · <a href="https://www.youtube.com/@387CLUB" target="_blank" rel="noopener noreferrer">YouTube</a></footer>
</main>

<script>
/* =====================================================================
   CONFIGURACIÓN — editá solo esta parte para cambiar el contenido
   ===================================================================== */

// Datos de cada artista.
//  - "colors": colores del muñequito dibujado por código (pelo, piel, remera, pantalón, zapatillas).
//  - "sprite": ruta del .gif de ese artista (ej: "sprites/santoo.gif"). Si lo dejás vacío
//    (o el archivo no carga) se usa el muñequito de "colors".
//  - "bio": texto corto. Si lo dejás vacío ("") no se muestra nada.
//  - "channelId": ID del canal de YouTube (empieza con UC).
//  - "releases": lanzamientos puestos a mano. Si lo dejás vacío ([]) se muestran solos
//    los últimos videos del canal del artista (los trae videos.json).
const LABEL = {
  name: "387CLUB",
  youtube: "https://www.youtube.com/@387CLUB",
  channelId: "UCfakH2WSupXLnQZkXU3WO6Q"
};

const ARTISTS = [
  {
    name: "SANTOO",
    bio: "Productor y artista de 387CLUB, uno de los dos productores con los que arrancó el sello.",
    sprite: "",
    colors: { H: "#222222", S: "#f1c9a0", T: "#e03131", P: "#1c3b8a", B: "#ffffff" },
    channelId: "UCN22QCnuiWapFX-lqi7-IEw",
    links: {
      Spotify: "https://open.spotify.com/intl-es/artist/3IxUs8UFJsVhUaTePqyo96?si=L3EwtUlDRL6SaF32QOSe1w",
      Instagram: "https://www.instagram.com/santoopecador/",
      YouTube: "https://www.youtube.com/@santoopecador"
    },
    releases: []
  },
  {
    name: "KIDDOLUCAS",
    bio: "Productor y artista de 387CLUB, uno de los dos productores con los que arrancó el sello. Se presenta como «Young Saltenian Money».",
    sprite: "",
    colors: { H: "#f2c200", S: "#f5d0b0", T: "#2f9e44", P: "#333333", B: "#e03131" },
    channelId: "UC0318NTJMH1fq8vDH8_i9zA",
    links: {
      Spotify: "https://open.spotify.com/intl-es/artist/6Pn1Blx5ObWeX8zw5EHmBt?si=PD9hwNaGTYa18g8zJeQQ_g",
      Instagram: "https://www.instagram.com/kkiddolucas/",
      YouTube: "https://www.youtube.com/@kiddolucas"
    },
    releases: []
  },
  {
    name: "FACU ASTRO",
    bio: "",
    sprite: "",
    colors: { H: "#5b3a1e", S: "#8d5a3b", T: "#7048e8", P: "#111111", B: "#ffd43b" },
    channelId: "UCAdI4YnEHgJARjDSHuXdQPw",
    links: {
      Spotify: "https://open.spotify.com/intl-es/artist/2aj7101jbrz7ujad7HV5sj?si=D5zcmYe-TlGZgRM_sVyWDw",
      Instagram: "https://www.instagram.com/facu_astr0/",
      YouTube: "https://www.youtube.com/channel/UCAdI4YnEHgJARjDSHuXdQPw"
    },
    releases: []
  },
  {
    name: "DALLY",
    bio: "",
    sprite: "",
    colors: { H: "#c2255c", S: "#f1c9a0", T: "#1098ad", P: "#1c3b8a", B: "#ffffff" },
    channelId: "UClBtP_H_XUMxc65Q7jEj7Bw",
    links: {
      Spotify: "https://open.spotify.com/intl-es/artist/7tw50eOwgwIAUtd8FtKpvS?si=SJJPpPDoTUiJcesKSWIn9A",
      Instagram: "https://www.instagram.com/d.alibertii/",
      YouTube: "https://www.youtube.com/@dallytheboy"
    },
    releases: []
  },
  {
    name: "RIOVA",
    bio: "",
    sprite: "",
    colors: { H: "#d9d9d9", S: "#f5d0b0", T: "#f08c00", P: "#2b2b2b", B: "#66d9e8" },
    channelId: "UC9eHUngzPYPnSLe9h24iTIA",
    links: {
      Spotify: "https://open.spotify.com/intl-es/artist/1W7DokDu7TneckWe4wnN11?si=RyB3px_XSMW6hWU_jqD6NA",
      Instagram: "https://www.instagram.com/rrriovaa/",
      YouTube: "https://www.youtube.com/@riova.530"
    },
    releases: []
  }
];

// Chistes del banner falso (rotan solos)
const ADS = [
  { big: "TOCA AQUI PARA PEGARLA EN LA MUSICA", small: "", cta: "TOCAR", fail: "UPS... SOS MUY PETE" },
  { big: "FELICIDADES, SOS EL VISITANTE N°387.000.000", small: "", cta: "RECLAMA SEXO GRATIS", fail: "Error 387: premio agotado" }
];

/* =====================================================================
   CÓDIGO
   ===================================================================== */

// ---------- sprites ----------
const FRAME_A = [
  "..HHHHHH..", ".HHHHHHHH.", ".HSSSSSSH.", ".HSESSESH.",
  "..SSSSSS..", "...SSSS...", ".TTTTTTTT.", "STTTTTTTTS",
  "S.TTTTTT.S", "S.TTTTTT.S", "..PPPPPP..", "..PPPPPP..",
  "..PP..PP..", "..PP..PP..", "..BB..BB..", ".BBB..BBB."
];
const FRAME_B = FRAME_A.slice(0, 12).concat(["...PPPP...", "...PPPP...", "...BBBB...", "...BBBB..."]);

function drawSprite(canvas, frame, colors) {
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, 10, 16);
  frame.forEach((row, y) => {
    [...row].forEach((ch, x) => {
      if (ch === ".") return;
      ctx.fillStyle = ch === "E" ? "#000" : colors[ch];
      ctx.fillRect(x, y, 1, 1);
    });
  });
}
function makeCanvas() {
  const c = document.createElement("canvas");
  c.width = 10; c.height = 16;
  return c;
}

const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const walkway = document.getElementById("walkway");
// Devuelve un <img> si el artista tiene .gif; si no (o si el archivo no carga),
// el muñequito dibujado por código.
function makeSpriteNode(a, frame, onFallback) {
  if (a.sprite) {
    const img = new Image();
    img.alt = "";
    img.onerror = () => {
      const c = makeCanvas();
      drawSprite(c, frame, a.colors);
      img.replaceWith(c);
      if (onFallback) onFallback(c);
    };
    img.src = a.sprite;
    return img;
  }
  const c = makeCanvas();
  drawSprite(c, frame, a.colors);
  return c;
}

const walkers = ARTISTS.map((a, i) => {
  const el = document.createElement("div");
  el.className = "sprite" + (a.sprite ? " gif" : "");
  const w = {
    el, canvas: null, colors: a.colors, frame: 0,
    x: Math.round((walkway.clientWidth - 40) * (i + 0.5) / ARTISTS.length),
    dir: i % 2 ? -1 : 1,
    speed: 1.2 + i * 0.25
  };
  const node = makeSpriteNode(a, FRAME_A, c => { w.canvas = c; el.classList.remove("gif"); });
  if (node instanceof HTMLCanvasElement) w.canvas = node;
  el.appendChild(node);
  walkway.appendChild(el);
  return w;
});

if (!reduce) {
  setInterval(() => {
    walkers.forEach(w => {
      if (!w.canvas) return; // los .gif se animan solos
      w.frame = 1 - w.frame;
      drawSprite(w.canvas, w.frame ? FRAME_B : FRAME_A, w.colors);
    });
  }, 220);
  let last = performance.now();
  (function tick(now) {
    const dt = Math.min(now - last, 50) / 16.67; last = now;
    walkers.forEach(w => {
      const max = walkway.clientWidth - w.el.offsetWidth; // de punta a punta de la franja
      w.x += w.dir * w.speed * dt;
      if (w.x > max) { w.x = max; w.dir = -1; }
      if (w.x < 0) { w.x = 0; w.dir = 1; }
      w.el.style.transform = `translateX(${w.x}px) scaleX(${w.dir})`;
    });
    requestAnimationFrame(tick);
  })(last);
} else {
  walkers.forEach(w => { w.el.style.transform = `translateX(${w.x}px)`; });
}

// ---------- datos de YouTube (videos.json lo regenera solo el actualizador) ----------
let VIDEOS = [];
const CHANNELS = [LABEL, ...ARTISTS];               // canales que alimentan el slider
const uploadsPlaylist = id => "UU" + id.slice(2);   // lista automática con todas las subidas de un canal
const ytWatch = id => "https://www.youtube.com/watch?v=" + id;
const newestFirst = (a, b) => (b.published || "").localeCompare(a.published || "");
const MAX_SLIDES = 12;

// ---------- slider ----------
const track = document.getElementById("track");

function makeIframe(src, title) {
  const f = document.createElement("iframe");
  f.src = src;
  f.title = title;
  f.loading = "lazy";
  f.allow = "autoplay; encrypted-media; picture-in-picture";
  f.allowFullscreen = true;
  return f;
}
function addSlide(box, name, title) {
  const cap = document.createElement("p");
  const b = document.createElement("b");
  b.textContent = name;
  cap.append(b, title ? " — " + title : "");
  const slide = document.createElement("div");
  slide.className = "slide";
  slide.append(box, cap);
  track.appendChild(slide);
}
// Un video suelto: se ve la miniatura y el reproductor carga al tocarla (así la página pesa poco).
function videoSlide(v) {
  const box = document.createElement("div");
  box.className = "video";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "thumb";
  btn.style.backgroundImage = "url(https://i.ytimg.com/vi/" + v.id + "/hqdefault.jpg)";
  btn.setAttribute("aria-label", "Reproducir: " + v.title);
  btn.onclick = () => box.replaceChildren(
    makeIframe("https://www.youtube-nocookie.com/embed/" + v.id + "?autoplay=1", v.title));
  box.appendChild(btn);
  addSlide(box, v.channel, v.title);
}
// Sin videos.json: un reproductor por canal con la lista de todo lo que subió (se actualiza solo).
function channelSlide(c) {
  const box = document.createElement("div");
  box.className = "video";
  box.appendChild(makeIframe(
    "https://www.youtube-nocookie.com/embed/videoseries?list=" + uploadsPlaylist(c.channelId),
    c.name + " — últimos videos"));
  addSlide(box, c.name, "últimos videos");
}
function buildSlider() {
  track.replaceChildren();
  const latest = [...VIDEOS].sort(newestFirst).slice(0, MAX_SLIDES);
  if (latest.length) latest.forEach(videoSlide);
  else CHANNELS.forEach(channelSlide);
}
const step = () => (track.querySelector(".slide")?.offsetWidth || 400) + 16;
document.getElementById("prev").onclick = () => track.scrollBy({ left: -step(), behavior: "smooth" });
document.getElementById("next").onclick = () => track.scrollBy({ left: step(), behavior: "smooth" });

// ---------- links de cada artista (Spotify, Instagram, YouTube) ----------
function makeLinks(a) {
  const box = document.createElement("div");
  box.className = "links";
  Object.entries(a.links).forEach(([name, url]) => {
    const l = document.createElement("a");
    l.href = url; l.textContent = name;
    l.target = "_blank"; l.rel = "noopener noreferrer";
    box.appendChild(l);
  });
  return box;
}

// ---------- artistas (inicio) ----------
function buildArtistList() {
  const list = document.getElementById("artistList");
  list.replaceChildren();
  ARTISTS.forEach(a => {
    const sec = document.createElement("div");
    sec.className = "artist";
    const h = document.createElement("h3");
    h.textContent = a.name;
    const ul = document.createElement("ul");
    ul.className = "releases";

    // lanzamientos a mano; si no hay, los últimos videos de su canal
    let items;
    if (a.releases.length) {
      items = a.releases.map(r => ({ title: r.title, url: r.url, meta: r.type + " · " + r.year }));
    } else {
      items = VIDEOS.filter(v => v.channel === a.name).sort(newestFirst).slice(0, 3).map(v => {
        const year = (v.published || "").slice(0, 4);
        return { title: v.title, url: ytWatch(v.id), meta: "YouTube" + (year ? " · " + year : "") };
      });
    }
    if (!items.length) items = [{ title: "Ver sus videos en YouTube", url: a.links.YouTube, meta: "YouTube" }];

    items.forEach(it => {
      const li = document.createElement("li");
      const link = document.createElement("a");
      link.href = it.url; link.textContent = it.title;
      if (/^https?:/.test(it.url)) { link.target = "_blank"; link.rel = "noopener noreferrer"; }
      const meta = document.createElement("span");
      meta.textContent = it.meta;
      li.append(link, meta);
      ul.appendChild(li);
    });
    sec.append(h, ul, makeLinks(a));
    list.appendChild(sec);
  });
}

// ---------- artistas (pestaña) ----------
function buildArtistPage() {
  const artistPage = document.getElementById("artistPage");
  artistPage.replaceChildren();
  ARTISTS.forEach(a => {
    const row = document.createElement("div");
    row.className = "big-artist";
    const box = document.createElement("div");
    box.className = "sprite-static";
    box.appendChild(makeSpriteNode(a, FRAME_A));
    const info = document.createElement("div");
    const h = document.createElement("h3"); h.textContent = a.name;
    info.appendChild(h);
    if (a.bio) {
      const p = document.createElement("p"); p.textContent = a.bio;
      info.appendChild(p);
    }
    info.appendChild(makeLinks(a));
    row.append(box, info);
    artistPage.appendChild(row);
  });
}

  buildArtistPage();
}
fetch("videos.json", { cache: "no-store" })
  .then(r => (r.ok ? r.json() : Promise.reject(new Error("sin videos.json"))))
  .then(d => {

// ---------- banner falso ----------
const adBox = document.getElementById("fakeAd");
let adIndex = 0;
function renderAd() {
  const ad = ADS[adIndex];
  adBox.innerHTML = "";
  const x = document.createElement("span"); x.className = "x"; x.textContent = "✕";
  const big = document.createElement("div"); big.className = "big"; big.textContent = ad.big;
  const small = document.createElement("div"); small.className = "small"; small.textContent = ad.small;
  const cta = document.createElement("span"); cta.className = "cta"; cta.textContent = ad.cta;
  const mq = document.createElement("div"); mq.className = "marquee";
  const ms = document.createElement("span"); ms.textContent = "*** OFERTA POR TIEMPO LIMITADO *** SOLO HOY *** 100% CONFIABLE ***";
  mq.appendChild(ms);
  x.onclick = () => { big.textContent = "NO SE PUEDE CERRAR"; };
  cta.onclick = () => { big.textContent = ad.fail; small.textContent = ""; cta.remove(); };
  adBox.append(x, big, small, cta, mq);
}
renderAd();
setInterval(() => { adIndex = (adIndex + 1) % ADS.length; renderAd(); }, 7000);

// ---------- pestañas ----------
function route() {
  const page = (location.hash || "#inicio").slice(1);
  const valid = ["inicio", "nosotros", "artistas"].includes(page) ? page : "inicio";
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "page-" + valid));
  document.querySelectorAll("nav.tabs a").forEach(a => {
    if (a.dataset.tab === valid) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
